[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-jobo"
dynamic = ["version"]
description = "LangChain integration for the Jobo jobs API: live job listings from employer career sites and ATS platforms, as tools, a retriever and a document loader."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jobo", email = "support@jobo.world" }]
keywords = [
    "langchain",
    "langgraph",
    "jobo",
    "jobs",
    "job-search",
    "job-listings",
    "ats",
    "recruitment",
    "tools",
    "retriever",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "httpx>=0.25.0,<1.0.0",
    "pydantic>=2.7.4,<3.0.0",
]

[project.urls]
Homepage = "https://jobo.world/integrations/langchain"
Repository = "https://github.com/JoboAI/langchain-jobo"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "langchain-tests>=1.1.0,<2.0.0",
    "langchain>=1.0.0,<2.0.0",
]
lint = ["ruff>=0.17.0,<0.18.0"]
typing = ["mypy>=2.4.0,<3.0.0"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
]

[tool.hatch.version]
path = "langchain_jobo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["langchain_jobo"]

[tool.hatch.build.targets.sdist]
include = ["langchain_jobo", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PT",
    "RUF",
    "D",
    "ANN",
    "S",
    "T20",
    "TID",
    "PIE",
    "RET",
    "N",
]
ignore = [
    "D105", # magic methods need no docstring
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN401"]
"langchain_jobo/**" = ["ANN401"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["langchain_jobo", "tests"]
